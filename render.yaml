services:
  - type: web
    name: aic-backend
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: aic-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://jfsagro-glitch.github.io/AIC
    healthCheckPath: /health

databases:
  - name: aic-db
    plan: free
    databaseName: aic
    user: user

